<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 주요 일정</title>
<style>
  :root {
    --bg: #0e1117; --card: #161b26; --card2: #1c2333; --border: #2a3247;
    --text: #f0f3fa; --dim: #9aa4bd; --accent: #7c8cf8; --accent2: #38bdf8;
    --green: #34d399; --red: #f87171; --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 14px 40px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.4px; }
  h1 .dot { color: var(--accent); }
  .range { color: var(--dim); font-size: 13px; }
  .day { margin-top: 18px; }
  .day-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 0 2px 7px; border-bottom: 1px solid var(--border);
  }
  .day-date { font-size: 15px; font-weight: 700; }
  .day-dow { font-size: 12.5px; color: var(--dim); }
  .day-count { margin-left: auto; font-size: 11.5px; color: var(--dim); }
  .ev {
    display: flex; gap: 10px; padding: 9px 10px; border-radius: 10px;
    align-items: baseline; margin-top: 6px; background: var(--card);
    border-left: 3px solid transparent;
  }
  .ev.high   { background: var(--card2); border-left-color: var(--red); }
  .ev.medium { border-left-color: var(--amber); }
  .imp {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; margin-right: 6px;
  }
  .imp.high   { background: rgba(248,113,113,0.18); color: var(--red); }
  .imp.medium { background: rgba(251,191,36,0.16);  color: var(--amber); }
  .imp.low    { background: rgba(154,164,189,0.14); color: var(--dim); }
  .legend {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    margin-top: 10px; font-size: 11px; color: var(--dim);
  }
  .legend b { color: var(--text); font-weight: 600; }
  .ev-time {
    flex: none; width: 46px; font-size: 12.5px; color: var(--accent2);
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .ev-time.none { color: var(--dim); font-weight: 400; }
  .ev-body { flex: 1; min-width: 0; }
  .ev-title { font-size: 14px; font-weight: 600; }
  .ev-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    background: rgba(124,140,248,0.16); color: var(--accent);
    font-size: 10.5px; font-weight: 600; margin-right: 6px;
  }
  .note {
    margin-top: 24px; padding: 11px 13px; border-radius: 10px;
    background: var(--card); color: var(--dim); font-size: 11.5px;
  }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; font-size: 14px; }
  footer { text-align: center; color: #3d465e; font-size: 11px; margin-top: 22px; line-height: 1.7; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>주간 주요 일정<span class="dot">.</span></h1>
    <div class="range" id="range">불러오는 중…</div>
    <div class="legend">
      <span>S&amp;P500·나스닥 영향</span>
      <span class="imp high">높음</span>
      <span class="imp medium">중간</span>
      <span class="imp low">낮음</span>
    </div>
  </header>
  <div id="list"><p class="empty">불러오는 중…</p></div>
  <div class="note" id="note" style="display:none">
    ⚠ AI가 검색으로 모은 일정이라 시각·내용이 바뀌거나 빠진 항목이 있을 수 있어요.
    영향도(높음/중간/낮음)도 S&amp;P500·나스닥 기준으로 AI가 매긴 추정치이니 참고용으로만 보시고,
    중요한 일정은 각 항목의 출처에서 한 번 더 확인해 주세요.
  </div>
  <footer>
    갱신: <span id="gen">—</span><br>
    <a href="on-demand.html">← 온디맨드 종목 영상</a>
  </footer>
</div>
<script>
const DOW = ['월','화','수','목','금','토','일'];
const IMPACT = { high: '영향 높음', medium: '영향 중간', low: '영향 낮음' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 날짜 문자열을 그대로 UTC 기준으로 해석 — 'T00:00+09:00'로 만들면 UTC에선 전날이라 요일이 밀린다
function dowOf(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return DOW[(new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7];
}
function mdOf(iso) {
  const [, m, d] = iso.split('-');
  return `${Number(m)}월 ${Number(d)}일`;
}

(async function () {
  try {
    const res = await fetch('data/calendar/latest.json?t=' + Date.now(), { cache: 'no-cache' });
    if (!res.ok) throw res.status;
    const data = await res.json();
    const events = data.events || [];

    document.getElementById('range').textContent =
      `${mdOf(data.week_start)} ~ ${mdOf(data.week_end)}`;
    document.getElementById('gen').textContent = data.generated_at || '—';

    if (!events.length) {
      document.getElementById('list').innerHTML =
        '<p class="empty">이번 주는 등록된 일정이 없어요.</p>';
      return;
    }

    const byDate = {};
    for (const ev of events) (byDate[ev.date] = byDate[ev.date] || []).push(ev);

    document.getElementById('list').innerHTML = Object.keys(byDate).sort().map(date => `
      <div class="day">
        <div class="day-head">
          <span class="day-date">${esc(mdOf(date))}</span>
          <span class="day-dow">${esc(dowOf(date))}요일</span>
          <span class="day-count">${byDate[date].length}건</span>
        </div>
        ${byDate[date].map(ev => {
          const imp = IMPACT[ev.impact] ? ev.impact : 'medium';
          return `
          <div class="ev ${imp}">
            <span class="ev-time${ev.time ? '' : ' none'}">${esc(ev.time || '–')}</span>
            <div class="ev-body">
              <div class="ev-title">${esc(ev.title)}</div>
              <div class="ev-meta">
                <span class="imp ${imp}">${IMPACT[imp]}</span>
                <span class="chip">${esc(ev.category)}</span>${esc(ev.source)}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`).join('');
    document.getElementById('note').style.display = 'block';
  } catch (e) {
    document.getElementById('range').textContent = '';
    document.getElementById('list').innerHTML =
      '<p class="empty">아직 생성된 일정이 없어요 — 주간 일정 워크플로가 한 번 돌면 여기 표시됩니다.</p>';
  }
})();
</script>
</body>
</html>
